<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="485px" preserveAspectRatio="none" style="width:595px;height:485px;background:#FFFFFF;" version="1.1" viewBox="0 0 595 485" width="595px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="454" x="63.5" y="22.9951">Webform Handoff: delivery record, without personal data</text><!--class Handoff--><g id="elem_Handoff"><rect codeLine="4" fill="#F1F1F1" height="260.125" id="Handoff" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="581" x="7" y="44.2969"/><ellipse cx="244.25" cy="64.4297" fill="#E69F00" rx="11" ry="11" style="stroke:#181818;stroke-width:1.0;"/><path d="M248.3594,70.4297 L240.6406,70.4297 L240.6406,58.0391 L248.3594,58.0391 L248.3594,60.1953 L243.0938,60.1953 L243.0938,62.8672 L247.8594,62.8672 L247.8594,65.0234 L243.0938,65.0234 L243.0938,68.2734 L248.3594,68.2734 L248.3594,70.4297 Z " fill="#000000"/><text fill="#000000" font-family="Arial" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="102" x="262.75" y="60.4355">&#171;content entity&#187;</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="53" x="287.25" y="76.2607">Handoff</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="587" y1="84.5625" y2="84.5625"/><text fill="#D32F2F" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="7" x="13" y="101.5576">*</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="97" x="24" y="101.5576">id : integer [1]</text><text fill="#D32F2F" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="7" x="13" y="117.8545">*</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="198" x="24" y="117.8545">reference : string, unique [1]</text><text fill="#D32F2F" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="7" x="13" y="134.1514">*</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="174" x="24" y="134.1514">webform : webform ID [1]</text><text fill="#D32F2F" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="7" x="13" y="150.4482">*</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="162" x="24" y="150.4482">created : timestamp [1]</text><text fill="#D32F2F" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="7" x="13" y="166.7451">*</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="304" x="24" y="166.7451">recipient_status : sent, failed or not_sent [1]</text><text fill="#D32F2F" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="7" x="13" y="183.042">*</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="558" x="24" y="183.042">acknowledgement_status : sent, failed, cancelled, not_sent or not_configured [1]</text><text fill="#D32F2F" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="7" x="13" y="199.3389">*</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="235" x="24" y="199.3389">visitor_notice_shown : boolean [1]</text><text fill="#D32F2F" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="7" x="13" y="215.6357">*</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="363" x="24" y="215.6357">visitor_failure_email : not_applicable, sent or failed [1]</text><text fill="#D32F2F" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="7" x="13" y="231.9326">*</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="333" x="24" y="231.9326">alert_status : not_applicable, pending or sent [1]</text><text fill="#D32F2F" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="7" x="13" y="248.2295">*</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="184" x="24" y="248.2295">alert_attempts : integer [1]</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="248" x="24" y="264.5264">alert_last_attempt : timestamp [0..1]</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="194" x="24" y="280.8232">alert_sent : timestamp [0..1]</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="211" x="24" y="297.1201">files : list of file outcomes [0..*]</text></g><!--class FileOutcome--><g id="elem_FileOutcome"><rect codeLine="20" fill="#F1F1F1" height="97.1563" id="FileOutcome" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="182" x="68.5" y="381.4169"/><ellipse cx="110.95" cy="401.5497" fill="#A57FDB" rx="11" ry="11" style="stroke:#181818;stroke-width:1.0;"/><path d="M111.0594,406.0028 L113.2469,395.6591 L115.7156,395.6591 L112.7625,408.0497 L109.3719,408.0497 L106.4188,395.6591 L108.8875,395.6591 L111.0594,406.0028 Z " fill="#000000"/><text fill="#000000" font-family="Arial" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="47" x="152.05" y="397.5555">&#171;value&#187;</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="89" x="131.05" y="413.3807">File outcome</text><line style="stroke:#181818;stroke-width:0.5;" x1="69.5" x2="249.5" y1="421.6825" y2="421.6825"/><text fill="#D32F2F" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="7" x="74.5" y="438.6776">*</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="150" x="85.5" y="438.6776">mime_type : string [1]</text><text fill="#D32F2F" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="7" x="74.5" y="454.9745">*</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="159" x="85.5" y="454.9745">size : integer, bytes [1]</text><text fill="#D32F2F" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="7" x="74.5" y="471.2714">*</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="145" x="85.5" y="471.2714">deleted : boolean [1]</text></g><g id="elem_GMN5"><path d="M285.5,394.7369 L285.5,465.2681 A0,0 0 0 0 285.5,465.2681 L585.5,465.2681 A0,0 0 0 0 585.5,465.2681 L585.5,404.7369 L575.5,394.7369 L420.64,394.7369 L367.91,304.7769 L412.64,394.7369 L285.5,394.7369 A0,0 0 0 0 285.5,394.7369 " fill="#FFFDE7" style="stroke:#BDB76B;stroke-width:0.5;"/><path d="M575.5,394.7369 L575.5,404.7369 L585.5,404.7369 L575.5,394.7369 " fill="#FFFDE7" style="stroke:#BDB76B;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="279" x="291.5" y="411.8038">Never stored: field values, email addresses,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="221" x="291.5" y="426.9366">file names, IP address, user agent.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="265" x="291.5" y="442.0694">Purged by cron after the retention period:</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="200" x="291.5" y="457.2022">365 days by default, 0 = never.</text></g><!--reverse link Handoff to FileOutcome--><g id="link_Handoff_FileOutcome"><path codeLine="26" d="M221.3552,315.3178 C206.5352,342.5578 197.54,359.0869 185.63,380.9769 " fill="none" id="Handoff-backto-FileOutcome" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="227.09,304.7769,220.7089,308.1357,221.3552,315.3178,227.7362,311.959,227.09,30